name: Build (Reusable)

on:
  workflow_call:
    inputs:
      upload-artifacts:
        description: 'Whether to upload build artifacts'
        required: false
        type: boolean
        default: true
      retention-days:
        description: 'Artifact retention days'
        required: false
        type: number
        default: 7
      sign-macos:
        description: 'Whether to sign macOS binaries'
        required: false
        type: boolean
        default: false
    secrets:
      DISCORD_CLIENT_ID:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_CERTIFICATE_DECRYPT_KEY:
        required: false

env:
  GO_VERSION: '1.25'

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Get dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -d .
            exit 1
          fi

      - name: Run go mod tidy check
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain)" ]; then
            echo "go.mod or go.sum is not tidy:"
            git diff
            exit 1
          fi

  build-non-macos:
    name: Build Non-macOS Binaries
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            name: discord-time-presence-windows-amd64.exe
          - goos: windows
            goarch: arm64
            name: discord-time-presence-windows-arm64.exe
          - goos: linux
            goarch: amd64
            name: discord-time-presence-linux-amd64
          - goos: linux
            goarch: arm64
            name: discord-time-presence-linux-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Get dependencies
        run: go mod download

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          CLIENT_ID="${{ secrets.DISCORD_CLIENT_ID }}"
          if [ -z "$CLIENT_ID" ]; then
            CLIENT_ID="PLACEHOLDER_CLIENT_ID"
          fi

          go build \
            -ldflags="-s -w -X 'main.DefaultClientID=$CLIENT_ID'" \
            -o ${{ matrix.name }} .

      - name: Upload artifacts
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          retention-days: ${{ inputs.retention-days }}

  build-macos:
    name: Build macOS Binaries
    runs-on: macos-latest
    needs: lint-and-test
    strategy:
      matrix:
        include:
          - goarch: amd64
            name: discord-time-presence-darwin-amd64
          - goarch: arm64
            name: discord-time-presence-darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Get dependencies
        run: go mod download

      - name: Build binary
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          CLIENT_ID="${{ secrets.DISCORD_CLIENT_ID }}"
          if [ -z "$CLIENT_ID" ]; then
            CLIENT_ID="PLACEHOLDER_CLIENT_ID"
          fi

          go build \
            -ldflags="-s -w -X 'main.DefaultClientID=$CLIENT_ID'" \
            -o ${{ matrix.name }} .

      - name: Import Code-Signing Certificates
        if: inputs.sign-macos
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE_DECRYPT_KEY: ${{ secrets.APPLE_CERTIFICATE_DECRYPT_KEY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "⚠️  Code signing skipped - no certificate configured"
            exit 0
          fi

          echo "Decrypting certificate from repository..."
          echo "$APPLE_CERTIFICATE_DECRYPT_KEY" | openssl aes-256-cbc -pbkdf2 -d -salt -in .github/certificates/apple-dev.p12.enc -out apple-cert.p12 -pass stdin

          # Import certificate to keychain
          security create-keychain -p "build" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "build" build.keychain
          security import apple-cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "build" build.keychain

          # Clean up
          rm apple-cert.p12

      - name: Code Sign Binary
        if: inputs.sign-macos
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "⚠️  Code signing skipped - no certificate configured"
            echo "Binary will be unsigned and may show security warnings on macOS"
            exit 0
          fi

          echo "Available code signing identities:"
          security find-identity -v -p codesigning
          echo ""
          echo "Code signing ${{ matrix.name }}..."
          # Try Developer ID Application first (for distribution), fallback to Apple Development
          if security find-identity -v -p codesigning | grep -q "Developer ID Application"; then
            IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')
            echo "Using Developer ID Application: $IDENTITY"
            codesign --sign "$IDENTITY" --force --verbose ${{ matrix.name }}
          elif security find-identity -v -p codesigning | grep -q "Apple Development"; then
            IDENTITY=$(security find-identity -v -p codesigning | grep "Apple Development" | head -1 | sed 's/.*"\(.*\)"/\1/')
            echo "Using Apple Development: $IDENTITY"
            codesign --sign "$IDENTITY" --force --verbose ${{ matrix.name }}
          else
            echo "No suitable code signing identity found"
            exit 1
          fi
          echo "Verifying signature..."
          codesign --verify --verbose ${{ matrix.name }}
          codesign --display --verbose=2 ${{ matrix.name }}

      - name: Upload artifacts
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          retention-days: ${{ inputs.retention-days }}
